<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel — Gestão T.I</title>
  <link rel="icon" href="img/premovale (1).png">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <script>
    /* Anti-flash: aplica tema ANTES do primeiro pixel ser renderizado */
    (function () {
      try {
        const saved = localStorage.getItem('premovale-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark-mode');
        }
      } catch (e) { }
    })();
  </script>

  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/nav.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/modals.css">
  <link rel="stylesheet" href="assets/css/menu.css">
  <link rel="stylesheet" href="assets/css/widgets.css">
</head>

<body>

  <!-- ══ NAVBAR (idêntica às demais páginas) ══ -->
  <nav>
    <div class="nav-logo" onclick="window.location.href='menu.html'" style="cursor:pointer;"
      title="Voltar ao Menu Geral">
      <img src="img/premovale (1).png" width="30px" height="30px">
      <span class="nav-title">
        <span class="nav-title-ti">T.I</span>
        <span class="nav-title-sep">/</span>
        <span class="nav-title-main">Gestão</span>
      </span>
    </div>

    <div class="nav-submod" id="submod-tabs"></div>

    <div class="nav-right">
      <!-- Timer de sessão -->
      <div id="session-timer" style="display:none;flex-direction:column;align-items:center;gap:3px;min-width:120px;">
        <div style="display:flex;align-items:center;gap:0.4rem;">
          <span
            style="font-size:0.6rem;font-family:'Space Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;">Sessão</span>
          <span id="session-countdown"
            style="font-size:0.75rem;font-family:'Space Mono',monospace;font-weight:700;color:var(--muted);letter-spacing:0.05em;transition:color 0.3s;">--:--</span>
        </div>
        <div id="session-bar-track"
          style="width:110px;height:3px;background:var(--surface3);border-radius:2px;overflow:hidden;">
          <div id="session-bar-fill"
            style="height:100%;width:100%;border-radius:2px;background:var(--accent);transition:width 1s linear,background 0.3s;">
          </div>
        </div>
      </div>
      <!-- Ramais -->
      <div style="position:relative;display:inline-block;" id="ramais-wrapper">
        <button class="sync-fab-small" id="ramais-btn" onclick="toggleRamaisDropdown()" title="Ramais"
          style="gap:0.4rem;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.99 15a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.92 4h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 11.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 18v-.08z" />
          </svg> Ramais
        </button>
        <div id="ramais-dropdown" class="ramais-dropdown" style="display:none;"></div>
      </div>
      <!-- Switch Tema -->
      <div id="theme-switch-track" data-dark="0" onclick="toggleDarkMode()" title="Alternar tema"
        style="display:flex;align-items:center;gap:0.3rem;cursor:pointer;background:var(--surface2);border:1px solid var(--border2);border-radius:20px;padding:0.25rem 0.55rem;transition:all 0.2s;flex-shrink:0;user-select:none;">
        <span style="font-size:0.8rem;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2m-7.07-14.07 1.41 1.41M18.66 18.66l1.41 1.41M2 12h2M20 12h2m-4.93-7.07-1.41 1.41M6.34 17.66l-1.41 1.41" />
          </svg></span>
        <div
          style="position:relative;width:28px;height:16px;background:var(--surface3);border-radius:8px;border:1px solid var(--border2);transition:background 0.2s;">
          <div id="theme-switch-thumb"
            style="position:absolute;top:1px;left:1px;width:12px;height:12px;background:var(--muted);border-radius:50%;transition:transform 0.2s,background 0.2s;">
          </div>
        </div>
        <span style="font-size:0.8rem;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
          </svg></span>
      </div>
      <!-- Firebase — só superadmin -->
      <button class="sync-fab-small" id="sync-fab-nav" title="Firebase: verificando conexão..." style="display:none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" />
        </svg> Firebase
      </button>
    </div>
  </nav>

  <!-- ══ LAYOUT ══ -->
  <div class="config-wrapper">

    <!-- SIDEBAR (somente módulos pai) -->
    <aside class="chamados-sidebar" id="chamados-sidebar">
      <button class="chamados-sidebar-toggle" id="sidebar-toggle-btn" onclick="toggleMenuSidebar()"
        title="Recolher/Expandir menu">
        <span id="sidebar-toggle-icon">‹</span>
      </button>

      <div class="chamados-sidebar-items">
        <span class="chamados-sidebar-label">Módulos</span>

        <a class="chamados-sidebar-item" id="dash-mod-ti" href="dashboard.html?modulo=ti" title="T.I">
          <span class="chamados-sidebar-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="12" x="3" y="4" rx="2" />
              <path d="M8 20h8M12 16v4" />
            </svg></span>
          <span class="chamados-sidebar-name">T.I</span>
        </a>

        <a class="chamados-sidebar-item" id="dash-mod-comercial" href="dashboard.html?modulo=comercial"
          title="Comercial" style="display:none;">
          <span class="chamados-sidebar-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="14" x="2" y="7" rx="2" />
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
            </svg></span>
          <span class="chamados-sidebar-name">Comercial</span>
        </a>

        <div class="chamados-sidebar-divider"></div>

        <a class="chamados-sidebar-item" id="dash-mod-geral" href="menu.html" title="Menu Principal">
          <span class="chamados-sidebar-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg></span>
          <span class="chamados-sidebar-name">Menu Principal</span>
        </a>

        <div class="chamados-sidebar-footer">
          <div class="chamados-sidebar-divider"></div>
          <a class="chamados-sidebar-item" href="configuracoes.html" title="Configurações" id="sidebar-config-btn"
            style="display:none;">
            <span class="chamados-sidebar-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                <circle cx="12" cy="12" r="3" />
              </svg></span>
            <span class="chamados-sidebar-name">Configurações</span>
          </a>
          <div class="chamados-sidebar-user">
            <div class="chamados-sidebar-avatar" id="dash-sidebar-avatar">?</div>
            <div class="chamados-sidebar-user-info">
              <span class="chamados-sidebar-user-name" id="dash-sidebar-name">—</span>
              <span class="chamados-sidebar-user-role" id="dash-sidebar-role">—</span>
            </div>
          </div>
          <button class="chamados-sidebar-logout" onclick="dashLogout()" title="Sair do sistema">
            <span class="chamados-sidebar-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" x2="9" y1="12" y2="12" />
              </svg></span>
            <span class="chamados-sidebar-name">Sair do sistema</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="config-main">
      <div id="dash-content" style="display:none;"></div>
      <div class="dash-construcao" id="dash-construcao" style="display:none;">
        <svg width="130" height="130" viewBox="0 0 64 64" fill="none" stroke="var(--muted)" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 58 L28 40 L36 40 L44 58 Z" />
          <path d="M24 50 H40" />
          <path d="M30 40 V12 M34 40 V12" />
          <path d="M30 34 L34 28 M34 34 L30 28 M30 24 L34 18 M34 24 L30 18" stroke-width="1.5" />
          <rect x="29" y="8" width="6" height="5" rx="1" stroke="var(--accent)" />
          <path d="M12 13 H58" />
          <path d="M16 13 L30 8 M52 13 L40 9" stroke-width="1.5" />
          <rect x="12" y="13" width="6" height="5" rx="1" />
          <path d="M50 13 V30" stroke="var(--accent)" stroke-width="1.5" />
          <path d="M48 30 a2 2 0 1 0 4 0" stroke="var(--accent)" stroke-width="1.5" />
        </svg>
        <div class="dash-construcao-title">Em construção</div>
        <div class="dash-construcao-sub">// este painel está sendo desenhado</div>
      </div>
    </main>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="assets/js/firebase.js"></script>
  <script src="assets/js/state.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/widgets.js"></script>

  <script src="assets/js/dashboard.js"></script>
</body>

</html>
